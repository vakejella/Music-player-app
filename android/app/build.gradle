plugins {
    id 'com.android.application'
}

android {
    namespace 'com.winamp.mobile'
    compileSdk 34

    defaultConfig {
        applicationId 'com.winamp.mobile'
        minSdk 24
        targetSdk 34
        versionCode 7
        versionName '1.0.6'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The web app is the single source of truth, one directory up from android/.
    // Copy it into a generated assets dir at build time so it never drifts.
    sourceSets {
        main {
            assets.srcDirs += "${buildDir}/generated/assets"
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}

tasks.register('syncWebAssets', Copy) {
    description 'Bundle the PWA into the APK assets.'
    from(rootDir.parentFile) {
        include 'index.html', 'manifest.webmanifest', 'sw.js'
        include 'css/**', 'js/**', 'icons/**'
    }
    into "${buildDir}/generated/assets/www"
}

tasks.named('preBuild') {
    dependsOn 'syncWebAssets'
}
